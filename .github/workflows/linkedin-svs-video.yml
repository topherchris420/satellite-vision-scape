name: Render LinkedIn video

on:
  push:
    branches:
      - chatgpt/linkedin-svs-video
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install render tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin fonts-dejavu-core

      - name: Render LinkedIn video
        shell: bash
        run: |
          set -euo pipefail

          OUT="build/linkedin"
          FONT="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          mkdir -p "$OUT"

          rsvg-convert -w 1280 -h 470 docs/media/jev-live-run.svg -o "$OUT/jev-live-run.png"

          ffmpeg -y -ignore_loop 0 -t 8 -i docs/media/agent-drive.gif \
            -vf "fps=30,scale=1080:980:force_original_aspect_ratio=decrease,pad=1080:1350:(ow-iw)/2:(oh-ih)/2:color=0x090b10,drawtext=fontfile=$FONT:text='SAME WORLD. SAME CONTROLS. SAME PHYSICS.':fontcolor=white:fontsize=40:x=(w-text_w)/2:y=105,drawtext=fontfile=$FONT:text='THE AGENT CHOOSES. THE SIMULATION DECIDES.':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=h-150" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -an "$OUT/01-agent-drive.mp4"

          ffmpeg -y -stream_loop -1 -t 6 -i docs/media/digital-twin-thesis.mp4 \
            -vf "fps=30,scale=1080:980:force_original_aspect_ratio=decrease,pad=1080:1350:(ow-iw)/2:(oh-ih)/2:color=0x090b10,drawtext=fontfile=$FONT:text='HUMANS AND AGENTS USE THE SAME INPUT PATH.':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=105,drawtext=fontfile=$FONT:text='EVERY ACTION BECOMES AN AUDITABLE TRACE.':fontcolor=white:fontsize=34:x=(w-text_w)/2:y=h-150" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -an "$OUT/02-thesis.mp4"

          ffmpeg -y -loop 1 -t 6 -i "$OUT/jev-live-run.png" \
            -vf "fps=30,scale=1000:-2:force_original_aspect_ratio=decrease,pad=1080:1350:(ow-iw)/2:(oh-ih)/2:color=0x090b10,drawtext=fontfile=$FONT:text='JEV AFTER HOURS: RECORDED LIVE RUN':fontcolor=white:fontsize=42:x=(w-text_w)/2:y=100,drawtext=fontfile=$FONT:text='212 DECISIONS / 0 COLLISIONS / 0 HUMAN INTERVENTIONS':fontcolor=white:fontsize=31:x=(w-text_w)/2:y=h-220,drawtext=fontfile=$FONT:text='geotwn.vercel.app  |  github.com/topherchris420/satellite-vision-scape':fontcolor=white:fontsize=23:x=(w-text_w)/2:y=h-140" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -an "$OUT/03-live-run.mp4"

          printf "file '01-agent-drive.mp4'\nfile '02-thesis.mp4'\nfile '03-live-run.mp4'\n" > "$OUT/concat.txt"

          ffmpeg -y -f concat -safe 0 -i "$OUT/concat.txt" \
            -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart -an \
            "$OUT/satellite-vision-scape-linkedin.mp4"

          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 \
            "$OUT/satellite-vision-scape-linkedin.mp4"

      - name: Upload LinkedIn video
        uses: actions/upload-artifact@v4
        with:
          name: satellite-vision-scape-linkedin
          path: build/linkedin/satellite-vision-scape-linkedin.mp4
          if-no-files-found: error
          retention-days: 7
