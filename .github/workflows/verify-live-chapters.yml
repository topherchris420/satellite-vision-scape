# Temporary: film Pine Gap with the repo's own software-graphics capture. Branch is deleted afterwards.
name: Temporary Pine Gap check
on:
  push:
    branches: [verify/live-chapters]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: sudo apt-get install -y imagemagick
      - name: Start the dev server
        run: |
          nohup bun run dev --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 2; done
      - name: Pine Gap stills
        continue-on-error: true
        run: |
          mkdir -p verify-shots
          node scripts/capture-readme-shots.mjs --url http://127.0.0.1:5173/ --out verify-shots --only briefing,explore,driving --quality low 2>&1 | tee verify-shots/log.txt
      - name: Commit stills to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f verify-shots
          git commit -m "Pine Gap stills"
          git push
