# Temporary: films the San Fierro README stills and the hidden-case playtest
# in headless Chromium and pushes them to the shots/readme branch. Removed before merge.
name: Capture screenshots

on:
  workflow_dispatch:
  push:
    branches: [readme-shots-christopher]

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: sudo apt-get install -y imagemagick
      - name: Start the dev server
        run: |
          nohup bun run dev --host 127.0.0.1 --port 5173 > /tmp/vite.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:5173/ > /dev/null && break; sleep 2; done
      - name: San Fierro stills
        id: sf
        continue-on-error: true
        run: |
          mkdir -p /tmp/shots/san-fierro
          NODE_PATH=$PWD/node_modules node scripts/capture-san-fierro-shots.mjs --url http://127.0.0.1:5173/ --out /tmp/shots/san-fierro 2>&1 | tee /tmp/shots/san-fierro-log.txt; exit ${PIPESTATUS[0]}
      - name: Hidden case playtest
        id: play
        continue-on-error: true
        run: node scripts/playtest-hidden-case.mjs --url http://127.0.0.1:5173/ --out /tmp/shots/playtest 2>&1 | tee /tmp/shots/playtest-log.txt; exit ${PIPESTATUS[0]}
      - if: always()
        run: tail -60 /tmp/vite.log
      - name: Push the results
        if: always()
        run: |
          mkdir -p /tmp/shots
          cd /tmp/shots
          git init -q -b shots/readme
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:shots/readme
      - if: steps.sf.outcome == 'failure' || steps.play.outcome == 'failure'
        run: exit 1
