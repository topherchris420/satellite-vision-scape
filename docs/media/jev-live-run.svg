<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
  <title id="t">Jev After Hours — recorded live run</title>
  <desc id="d">Jev completed After Hours autonomously in 212 decisions and 7 minutes 38 seconds: coffee collected at 0:06, delivered at 1:30 with 100% remaining, clue heard at 1:39, receiver locked on 420 at 2:21, terminals locked at 3:01, 3:25, 4:08 and 5:06, concert began at 6:14 and the transmission was received at 7:38. Zero collisions and zero human interventions; median decision latency 289 ms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a18"/>
      <stop offset="1" stop-color="#171230"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="470" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .num  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: #fff4e6; }
    .lab  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; letter-spacing: 1.2px; fill: #9ca3af; }
    .ms   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; fill: #e5e7eb; }
    .tm   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; font-weight: 700; }
    .live { animation: live 1.4s ease-in-out infinite; }
    @keyframes live { 0%, 100% { opacity: 1 } 50% { opacity: .25 } }
    @media (prefers-reduced-motion: reduce) { .live { animation: none } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="470" fill="url(#bg)"/>

    <!-- header -->
    <circle class="live" cx="84" cy="52" r="6" fill="#34d399"/>
    <text x="100" y="57" class="mono" font-size="14" font-weight="700" letter-spacing="3" fill="#34d399">JEV · AUTONOMOUS</text>
    <text x="304" y="57" class="mono" font-size="14" letter-spacing="2" fill="#6b7280">LIVE RUN · PINE GAP: AFTER HOURS · FULL JOURNEY</text>
    <text x="1200" y="57" text-anchor="end" class="mono" font-size="13" fill="#6b7280">svs-agent-trace/v1</text>

    <!-- stat tiles -->
    <g transform="translate(80 84)">
      <g><text y="50" class="num">212</text><text y="78" class="lab">DECISIONS</text></g>
      <g transform="translate(190 0)"><text y="50" class="num">7:38</text><text y="78" class="lab">START → FINISH</text></g>
      <g transform="translate(380 0)"><text y="50" class="num" fill="#fbbf24" style="fill:#fbbf24">100%</text><text y="78" class="lab">COFFEE DELIVERED</text></g>
      <g transform="translate(580 0)"><text y="50" class="num">0</text><text y="78" class="lab">COLLISIONS</text></g>
      <g transform="translate(740 0)"><text y="50" class="num">0</text><text y="78" class="lab">HUMAN INTERVENTIONS</text></g>
      <g transform="translate(960 0)"><text y="50" class="num">289<tspan font-size="26" font-weight="600" fill="#9ca3af"> ms</tspan></text><text y="78" class="lab">MEDIAN DECISION</text></g>
    </g>
    <line x1="80" y1="182" x2="1200" y2="182" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- stage bar: x = 80 + t * 2.4465 -->
    <g transform="translate(0 268)">
      <rect x="80"    y="-7" width="219.9" height="14" rx="7" fill="#fbbf24"/>
      <rect x="301.9" y="-7" width="121.3" height="14" fill="#5eead4"/>
      <rect x="427.2" y="-7" width="398.5" height="14" fill="#a78bfa"/>
      <rect x="829.7" y="-7" width="164.3" height="14" fill="#64748b"/>
      <rect x="998"   y="-7" width="202"   height="14" rx="7" fill="#f472b6"/>
      <!-- the fill of the bar that the playhead has not reached yet is dimmed -->
      <rect x="80" y="-9" width="1122" height="18" fill="#0b0d1f" fill-opacity="0.72">
        <animate attributeName="x" values="80;1202;1202" keyTimes="0;0.8;1" dur="10s" repeatCount="indefinite"/>
        <animate attributeName="width" values="1122;0;0" keyTimes="0;0.8;1" dur="10s" repeatCount="indefinite"/>
      </rect>
      <g>
        <animateTransform attributeName="transform" type="translate" values="80 0;1200 0;1200 0" keyTimes="0;0.8;1" dur="10s" repeatCount="indefinite"/>
        <line x1="0" y1="-18" x2="0" y2="18" stroke="#ffffff" stroke-width="2"/>
        <circle r="5" fill="#ffffff"/>
      </g>

      <!-- stage names -->
      <text x="190"  y="-18" text-anchor="middle" class="lab" style="fill:#fbbf24">LAST COFFEE</text>
      <text x="364"  y="-18" text-anchor="middle" class="lab" style="fill:#5eead4">FREQUENCY 420</text>
      <text x="627"  y="-18" text-anchor="middle" class="lab" style="fill:#a78bfa">FOUR TERMINALS</text>
      <text x="912"  y="-18" text-anchor="middle" class="lab" style="fill:#94a3b8">LISTENING POINT</text>
      <text x="1099" y="-18" text-anchor="middle" class="lab" style="fill:#f472b6">MIDNIGHT CONCERT</text>
    </g>

    <!-- milestones above the bar -->
    <g stroke="#ffffff" stroke-opacity="0.25">
      <line x1="94"   y1="206" x2="94"   y2="236"/>
      <line x1="300"  y1="206" x2="300"  y2="236"/>
      <line x1="425"  y1="206" x2="425"  y2="236"/>
      <line x1="996"  y1="206" x2="996"  y2="236"/>
    </g>
    <text x="100"  y="214" class="tm" fill="#fbbf24">0:06</text><text x="152" y="214" class="ms">coffee collected</text>
    <text x="306"  y="214" class="tm" fill="#fbbf24">1:30</text><text x="358" y="214" class="ms">delivered · 100%</text>
    <text x="1002" y="214" class="tm" fill="#f472b6">6:14</text><text x="1054" y="214" class="ms">concert begins</text>

    <!-- milestones below the bar -->
    <g stroke="#ffffff" stroke-opacity="0.25">
      <line x1="118" y1="288" x2="118" y2="318"/>
      <line x1="323" y1="288" x2="323" y2="318"/>
      <line x1="425" y1="288" x2="425" y2="370"/>
      <line x1="522" y1="288" x2="522" y2="318"/>
      <line x1="581" y1="288" x2="581" y2="318"/>
      <line x1="687" y1="288" x2="687" y2="318"/>
      <line x1="828" y1="288" x2="828" y2="318"/>
      <line x1="1200" y1="288" x2="1200" y2="318"/>
    </g>
    <text x="124" y="338" class="tm" fill="#fbbf24">0:16</text><text x="124" y="360" class="ms">into UV-1</text>
    <text x="329" y="338" class="tm" fill="#5eead4">1:39</text><text x="329" y="360" class="ms">clue heard</text>
    <text x="431" y="384" class="tm" fill="#5eead4">2:21</text><text x="431" y="406" class="ms">receiver locked on 420</text>
    <text x="528" y="338" class="tm" fill="#a78bfa">3:01</text><text x="528" y="360" class="ms">T1</text>
    <text x="587" y="338" class="tm" fill="#a78bfa">3:25</text><text x="587" y="360" class="ms">T2</text>
    <text x="693" y="338" class="tm" fill="#a78bfa">4:08</text><text x="693" y="360" class="ms">T3</text>
    <text x="834" y="338" class="tm" fill="#a78bfa">5:06</text><text x="834" y="360" class="ms">T4</text>
    <text x="1194" y="338" text-anchor="end" class="tm" fill="#f472b6">7:38</text>
    <text x="1194" y="360" text-anchor="end" class="mono" font-size="14" font-weight="700" letter-spacing="1.2" fill="#fff4e6">TRANSMISSION RECEIVED</text>

    <text x="80" y="448" class="mono" font-size="13" fill="#6b7280">One recorded run (TypeSafe jev-1.13.0, real server handler, real physics). An existence proof, not a success rate.</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="469" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
